services:

  site1:
    build: ./site1
    restart: unless-stopped
    networks:
      - web

  site2:
    build: ./site2
    restart: unless-stopped
    networks:
      - web

  site3:
    build: ./site3
    restart: unless-stopped
    networks:
      - web
  proxy:
    image: nginx:alpine
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - site1
      - site2
      - site3

    networks:
      - web

networks:
  web:
    driver: bridge
