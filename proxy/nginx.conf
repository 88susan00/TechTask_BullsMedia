events {}

http {

    upstream site1 {
        server site1:80;
    }

    upstream site2 {
        server site2:80;
    }

    upstream site3 {
        server site3:8083;
    }

    server {

        listen 80;

        location /site1/ {
            proxy_pass http://site1/;
        }

        location /site2/ {
            proxy_pass http://site2/;
        }

        location /site3/ {
            proxy_pass http://site3/;
        }
    }
}
